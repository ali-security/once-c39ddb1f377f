name: Node CI

on:
  workflow_dispatch:

jobs:
  build:
    name: Test Node.js ${{ matrix.node-version }} on ${{ matrix.os }}

    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [10.x, 12.x, 14.x, 16.x]
        exclude:
          # macos-latest runners are Apple Silicon (arm64) and Node.js < 16
          # publishes no darwin-arm64 build, so those legs cannot be provisioned.
          - os: macos-latest
            node-version: 10.x
          - os: macos-latest
            node-version: 12.x
          - os: macos-latest
            node-version: 14.x

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Print Node.js Version
      run: node --version

    - name: Configure npm time machine registry
      run: npm config set registry https://:2021-09-22T23%3A50%3A52.041000Z@time-machines-npm.sealsecurity.io/

    - name: Install Dependencies
      run: npm install
      env:
        CI: true

    - name: Run "build" step
      run: npm run build --if-present
      env:
        CI: true

    - name: Run tests
      run: npm test
      env:
        CI: true

    - name: Pack tarball
      if: matrix.os == 'ubuntu-latest' && matrix.node-version == '16.x'
      run: |
        npm pack
        mv "$(ls *.tgz)" once-2.0.0.tgz

    - name: Upload tarball
      if: matrix.os == 'ubuntu-latest' && matrix.node-version == '16.x'
      uses: actions/upload-artifact@v4
      with:
        name: npm-tarball
        path: once-2.0.0.tgz
        if-no-files-found: error
